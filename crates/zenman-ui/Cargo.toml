[package]
name = "zenman-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "zen-man egui shell built on craft-ui primitives: dock, panes, tabs, dialogs (plan §5.7-§5.8)"

# Plan §5.1 keeps the workspace's `unsafe_code = "forbid"`; this crate declares its own lint table
# with `deny` (the photocraft precedent for a non-`forbid` crate is `crates/tablet/Cargo.toml:10-16`,
# which replaces the inherited table rather than doubling it), and states `#![deny(unsafe_code)]` in
# source. No `unsafe` is planned here; the downgrade exists only so a future platform shim can be a
# reviewed, crate-local exception instead of a workspace-wide one.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
cognitive_complexity = "deny"
too_many_arguments = "deny"
wildcard_imports = "deny"
dbg_macro = "warn"
todo = "warn"

[dependencies]
# The framework this crate is written against (plan §5.1: declared up front so the crate boundary
# UI = egui, core = headless is fixed by a manifest, and `xtask deps`/`licenses` see the real graph).
craft-ui = { workspace = true }
egui = { workspace = true }
zenman-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# `persist.rs` (plan §5.7): the settings store is the crate's only IO route besides `zenman-core`.
craft-settings = { workspace = true }

[dev-dependencies]
# Step 7 makes the four step-1 "later step" patches live (plan §9.1 row 4): the kittest harness
# drives `ZenApp` head-fully, and `snapshot`+`wgpu` give `xtask snapshots` its rasterised PNG.
egui_kittest = { workspace = true, features = ["snapshot", "wgpu"] }
egui_extras = { workspace = true }
# The rasteriser probe in `tests/snapshots.rs` must *see* the adapters before it renders (kittest's
# own renderer panics with no adapter — plan §9.2 step-7 row), hence the direct wgpu/pollster/image
# dev-deps at the versions the egui fork's workspace already pins.
wgpu = { workspace = true }
pollster = { workspace = true }
image = { workspace = true }

