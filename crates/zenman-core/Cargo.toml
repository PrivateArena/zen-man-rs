[package]
name = "zenman-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "zen-man headless engine: files, archives, index, undo log, jobs (plan §5.2-§5.6)"

# `unsafe_code = "forbid"` is inherited from `[workspace.lints.rust]` (plan §5.1); the crate also
# states it in source with `#![forbid(unsafe_code)]` (plan §5.1 lib.rs row).
[lints]
workspace = true

[dependencies]
# Step 1: intentionally empty. `cargo xtask deps` proves this crate stays free of
# egui/eframe/craft-ui, and plan §5.2-§5.6 add thiserror/serde/rusqlite/… in the steps that need them.
thiserror = "2"
bitflags = "2"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
serde = { workspace = true }
serde_json = { workspace = true }
rustix = { version = "1.1.6", features = ["fs"] }
trash = "5.4.0"
open = "5.4.5"
# `rustix` (safe `statvfs`, incl. the `f_fsid` VFS id), `trash` (plan R/D6 delete path) and `open` (the
# `xdg-open` seam, plan F2) entered with plan §5.2's `platform/{linux,env_probe}.rs` — this step.
# `bitflags` backs `PlatformCaps`/`ProbeFlags` as well as `mode::ModeBits`.
