[package]
name = "zenman-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "zen-man headless engine: files, archives, index, undo log, jobs (plan §5.2-§5.6)"

[features]
# Plan §5.5 `index/watcher.rs`: the filesystem watcher. **No dependency is added by this feature** —
# the backend is `rustix::fs::inotify`, already a pinned dependency under the `fs` feature that
# `platform/linux.rs` needs (rustix 1.1.6 has no separate `inotify` feature), so `watch = []` is a
# pure `#[cfg]` switch and `cargo xtask licenses` prints the same graph with it on or off. Off by
# default: the default build must not change behaviour at all (plan §7 step 12 "watcher feature
# compiles on and off", gated in `xtask ci`).
watch = []

# Plan §5.5/§10 item 3: RAR support. **This feature adds no dependency**, on purpose: the two Rust RAR
# crates (`rar` 0.4, `unrar` 0.5) declare MIT but wrap the unRar binary / vendored UnRAR source, whose
# licence is not on the Craft allowlist (`deny.toml` `[bans]` denies both names). Enabling it therefore
# only compiles the `#[cfg(feature = "rar")]` code paths, which return the same typed
# `CoreError::Unsupported` the default build returns; the real reader is an external, user-installed
# binary (plan §10 item 3's clean-room note), which is later work.
rar = []

# `unsafe_code = "forbid"` is inherited from `[workspace.lints.rust]` (plan §5.1); the crate also
# states it in source with `#![forbid(unsafe_code)]` (plan §5.1 lib.rs row).
[lints]
workspace = true

[dependencies]
# Step 1: intentionally empty. `cargo xtask deps` proves this crate stays free of
# egui/eframe/craft-ui, and plan §5.2-§5.6 add thiserror/serde/rusqlite/… in the steps that need them.
thiserror = "2"
bitflags = "2"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
serde = { workspace = true }
serde_json = { workspace = true }
# `fs` covers `rustix::fs::inotify` (plan §5.5 `index/watcher.rs`, step 12b) as well as the `statvfs`
# and xattr calls `platform/linux.rs` needs; there is no `inotify` feature in rustix 1.1.6 to add.
# **Step 16a:** the dependency itself moved to `[target.'cfg(unix)'.dependencies]` at the bottom.
trash = "5.4.0"
open = "5.4.5"
# `rustix` (safe `statvfs`, incl. the `f_fsid` VFS id), `trash` (plan R/D6 delete path) and `open` (the
# `xdg-open` seam, plan F2) entered with plan §5.2's `platform/{linux,env_probe}.rs` — this step.
# `bitflags` backs `PlatformCaps`/`ProbeFlags` as well as `mode::ModeBits`.
# `rusqlite` (plan §5.4 `store/sql.rs` row) arrived with step 5's persistence work; `bundled` is what
# makes the FTS5 + trigram tokenizer the Go schema needs available, and what lets `xtask licenses` see a
# C SQLite we control rather than whatever the distro ships.
rusqlite = { workspace = true }
# Plan §5.5 step 13a: the two default-build archive readers (licence note in the root table).
zip = { workspace = true }
sevenz-rust = { workspace = true }

[dev-dependencies]
# Step 13b's 7z round trip (`tests/archive_sevenz.rs`) needs the **writer** half of `sevenz-rust`,
# which the crate spells `compress` (there is no feature called `write`). Dev-only on purpose: the
# shipped build reads 7z and never writes one, so `cargo build` still compiles the reader-only feature
# set. This adds no package to the graph — `sevenz-rust` is already a dependency above.
sevenz-rust = { workspace = true, features = ["compress"] }

# Step 16a target gating. `rustix` is **unix-only by construction**: it does compile for
# `x86_64-pc-windows-msvc`, but to an almost empty module set, so a plain dependency lets a
# `rustix::fs::statvfs` call sit behind a `#[cfg(not(unix))]` arm that nothing compiles until step 16a and
# that then fails *there*. As a target dependency it is simply absent on Windows, which is the honest
# shape: `platform/linux.rs`'s `statvfs`/`accessat` calls and `index/watcher.rs`'s inotify backend are
# already `#[cfg(unix)]` / `#[cfg(target_os = "linux")]`, and `platform/windows.rs` names no rustix path at
# all. `trash` and `open` stay unconditional — both are cross-platform, and both *are* the Windows
# implementation's trash/opener too (plan §10 item 4).
[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.6", features = ["fs"] }
