[package]
name = "zenman"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "zen-man: a native egui file manager (plan §5.9) — the thin binary over zenman-core + zenman-ui"

# Plan §5.1/§5.9 and rule R4 of the step-1 brief: the binary may declare `deny` where the workspace
# says `forbid`, so a future platform shim is a crate-local, reviewable exception. Mechanism copied
# from photocraft's exception crate (`crates/tablet/Cargo.toml:10-16`), which replaces the inherited
# `[lints]` table instead of adding to it.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
cognitive_complexity = "deny"
too_many_arguments = "deny"
wildcard_imports = "deny"
dbg_macro = "warn"
todo = "warn"

[dependencies]
zenman-core = { workspace = true }
zenman-ui = { workspace = true }
craft-ui = { workspace = true }
craft-settings = { workspace = true }
eframe = { workspace = true }
egui = { workspace = true }
# `install_image_loaders` (plan §5.9 main.rs row) is step 7's job, when the SVG registry lands; the
# dependency is declared now because it is part of the forked-egui graph `xtask deps` audits.
egui_extras = { workspace = true }
clap = { workspace = true }
directories = { workspace = true }
log = { workspace = true }
# The translated catalogs, generated by `build.rs` (plan §5.4/§5.9). Optional on purpose: the default
# build links no new crate, so `cargo check -p zenman` is unchanged with or without `CRAFT_I18N_DIR`,
# and the English passthrough needs no runtime dependency at all. See `build.rs` for the convention.
craft-i18n = { workspace = true, optional = true }

[target.'cfg(unix)'.dependencies]
# `fcntl_setfd`/`fcntl_getfd` for the instance socket's `FD_CLOEXEC` (plan §5.9 `single_instance.rs`).
# `rustix` is already in the graph through `zenman-core`; `io` is a built-in module, not a feature.
rustix = { version = "1.1.6" }

[build-dependencies]
# `build.rs` is pure Rust over `serde_json::Value` — no bash, no python, no derive macros.
serde_json = { workspace = true }

[features]
# Embed the `CRAFT_I18N_DIR` catalogs. Off by default; the generated file is only compiled when on.
i18n = ["dep:craft-i18n"]

[dev-dependencies]
# `apps/zenman/tests/gpu_fallback.rs` drives the compiled binary through the smoke path.
# (No harness dependency: the test only needs `std::process::Command`.)
